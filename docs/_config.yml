title: Spek
description: >-
  Spek is an actor-based, C#-inspired programming language for the .NET
  ecosystem. It eliminates shared mutable state, locks, and concurrency bugs
  by design: isolated actors communicate exclusively through immutable
  messages, with the rules enforced at compile time.

# Theme: just-the-docs is the standard for technical docs on GitHub Pages.
# It is supported by github-pages' built-in Jekyll processor, so no Node or
# external build step is required.
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

# Plugins. jekyll-remote-theme resolves the theme above. It's on GitHub
# Pages' allowlist (so the default build is unaffected) and is required when
# the GitHub Actions workflow builds with `bundle exec jekyll build` (the
# build that loads the custom Spek Rouge lexer in _plugins/).
plugins:
  - jekyll-remote-theme

search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 3
  preview_words_after: 5
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  "View on GitHub":
    - "//github.com/spek-lang/spek"

footer_content: >-
  Spek is pre-release software; APIs can change between 0.x releases. See
  the <a href="https://github.com/spek-lang/spek">repository</a> for
  current status.

callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

# Not part of the rendered site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

permalink: pretty   # clean URLs

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    default_lang: csharp
    block:
      line_numbers: false
