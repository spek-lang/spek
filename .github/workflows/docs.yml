name: docs

# Builds and deploys the documentation site to GitHub Pages. Unlike Pages'
# default build (which runs Jekyll in --safe mode and ignores _plugins/), this
# workflow runs `bundle exec jekyll build`, so the custom Spek Rouge lexer in
# docs/_plugins/spek_lexer.rb is loaded and ```spek blocks get highlighted.
#
# Every job is gated on a `guard` step that checks for docs/: on a branch
# without the directory the workflow succeeds as a no-op instead of failing
# at the Ruby/Jekyll steps. Pull requests that touch docs/ build and check
# links but do not deploy.
#
# To use it, set the repository's Pages source to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: ["develop"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-links.py"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-links.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gracefully no-op when docs/ isn't present. build/deploy run only when
  # the directory exists.
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_docs: ${{ steps.check.outputs.has_docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for docs/
        id: check
        run: |
          if [ -d docs ]; then
            echo "has_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docs=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=docs skipped::No docs/ directory in this repository; nothing to build."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.has_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown links
        run: python3 scripts/check-doc-links.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: "docs"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site (loads docs/_plugins, incl. the Spek Rouge lexer)
        run: bundle exec jekyll build --source . --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: "docs"
        env:
          JEKYLL_ENV: production

      - name: Check built HTML links
        working-directory: "docs"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          extra=()
          if [ -n "$BASE_PATH" ]; then
            extra+=(--swap-urls "^${BASE_PATH}/:/")
          fi
          bundle exec htmlproofer _site --disable-external --no-enforce-https "${extra[@]}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/_site"

  deploy:
    needs: [guard, build]
    if: github.event_name != 'pull_request' && needs.guard.outputs.has_docs == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
